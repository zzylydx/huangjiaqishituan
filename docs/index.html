<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="皇家骑士团">
<meta name="theme-color" content="#0b0d14">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>皇家骑士团</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0d14;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  body {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #screenframe {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    padding: 4px 6px 2px;
  }
  #game {
    background: #000;
    display: block;
    touch-action: none;
  }
  #pad {
    flex: 0 0 auto;
    width: 100%;
    max-width: 430px;
    display: flex;
    flex-direction: column;
    padding: 3px 8px 6px;
    gap: 5px;
    min-height: 0;
  }
  .softrow {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }
  .softkey {
    flex: 1;
    height: 38px;
    border: 1px solid #2c3247;
    border-radius: 8px;
    background: linear-gradient(#1b2030, #141824);
    color: #cdd4e8;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .softkey:active, .softkey.pressed { background: #2c3552; }
  #midrow {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
    min-height: 0;
    align-items: stretch;
  }
  #dpad {
    flex: 0 0 auto;
    width: 134px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 42px 42px 42px;
    gap: 4px;
  }
  .dbtn {
    border: 1px solid #2c3247;
    border-radius: 8px;
    background: linear-gradient(#1b2030, #141824);
    color: #8b93ac;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .dbtn:active, .dbtn.pressed { background: #2c3552; color: #e8ecf8; }
  .dbtn.up { grid-column: 2; grid-row: 1; }
  .dbtn.left { grid-column: 1; grid-row: 2; }
  .dbtn.fire { grid-column: 2; grid-row: 2; border-radius: 50%; background: linear-gradient(#33241c, #241812); color: #f0b090; border-color: #4a3226; }
  .dbtn.fire:active, .dbtn.fire.pressed { background: #54372a; }
  .dbtn.right { grid-column: 3; grid-row: 2; }
  .dbtn.down { grid-column: 2; grid-row: 3; }
  #numpad {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: 42px 42px 42px;
    gap: 4px;
    min-width: 0;
  }
  .nbtn {
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 1px solid #262b3d;
    border-radius: 8px;
    background: linear-gradient(#171b28, #111420);
    color: #aeb6cd;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .nbtn:active, .nbtn.pressed { background: #2c3552; color: #fff; }
  /* 键盘收起（全触屏模式） */
  body.padhidden #pad { display: none; }
  body.padhidden #screenframe { padding: 0; }
  #floatcol {
    display: none;
    position: fixed;
    right: calc(4px + env(safe-area-inset-right));
    top: 50%;
    transform: translateY(-50%);
    flex-direction: column;
    gap: 10px;
    z-index: 40;
  }
  body.padhidden #floatcol { display: flex; }
  .fbtn {
    width: 34px;
    height: 34px;
    border: 1px solid #2c3247;
    border-radius: 50%;
    background: rgba(20, 24, 36, 0.72);
    color: #cdd4e8;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .fbtn:active { background: #2c3552; }
  /* 触摸分区反馈 */
  #zoneflash {
    position: absolute;
    display: none;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.65);
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }
</style>
</head>
<body>
  <div id="screenframe"><canvas id="game" width="720" height="960"></canvas><div id="zoneflash"></div></div>
  <div id="pad">
    <div class="softrow">
      <button class="softkey" data-code="-6" aria-label="左软键">菜单</button>
      <button class="softkey" data-code="-7" aria-label="右软键">返回</button>
      <button class="softkey" id="btnTouch" type="button" aria-label="切换触摸模式">触控·直控</button>
      <button class="softkey" id="btnQuality" type="button" aria-label="切换画质模式">画质·锐利</button>
    </div>
    <div id="midrow">
      <div id="dpad">
        <button class="dbtn up"    data-code="-1">▲</button>
        <button class="dbtn left"  data-code="-3">◀</button>
        <button class="dbtn fire"  data-code="-5">确认</button>
        <button class="dbtn right" data-code="-4">▶</button>
        <button class="dbtn down"  data-code="-2">▼</button>
      </div>
      <div id="numpad">
        <button class="nbtn" data-code="49">1</button>
        <button class="nbtn" data-code="50">2</button>
        <button class="nbtn" data-code="51">3</button>
        <button class="nbtn" data-code="52">4</button>
        <button class="nbtn" data-code="53">5</button>
        <button class="nbtn" data-code="54">6</button>
        <button class="nbtn" data-code="55">7</button>
        <button class="nbtn" data-code="56">8</button>
        <button class="nbtn" data-code="57">9</button>
        <button class="nbtn" data-code="42">*</button>
        <button class="nbtn" data-code="48">0</button>
        <button class="nbtn" data-code="35">#</button>
      </div>
    </div>
    <div class="softrow">
      <button class="softkey" id="btnPadHide" type="button" aria-label="收起键盘进入全触屏">⌨ 收起键盘 · 全触屏</button>
      <button class="softkey" id="btnPack" type="button" aria-label="切换关卡包">关卡包·原版</button>
    </div>
  </div>
  <div id="floatcol">
    <button class="fbtn" id="floatPad" type="button" aria-label="恢复键盘">⌨</button>
    <button class="fbtn" data-code="-6" aria-label="菜单">☰</button>
    <button class="fbtn" data-code="-7" aria-label="返回">↩</button>
  </div>
  <script src="audio.js"></script>
  <script src="hd.js"></script>
  <script>
    // 关卡包选择：classic=原版 | custom=扩展包（重排地图变体），双 TeaVM 构建
    window.__pack = 'classic';
    try {
      window.__pack = localStorage.getItem('hsqst_pak') === 'custom' ? 'custom' : 'classic';
    } catch (e) {}
    var qp = location.search.match(/pack=(custom|classic)/);
    if (qp) {
      window.__pack = qp[1];
      try { localStorage.setItem('hsqst_pak', qp[1]); } catch (e) {}
    }
    var packScript = document.createElement('script');
    packScript.src = window.__pack === 'custom' ? 'game_custom.js' : 'game.js';
    packScript.onload = function () {
      if (typeof window.main === 'function') window.main();
      else document.title = 'BOOT FAIL: no main()';
    };
    packScript.onerror = function () {
      if (window.__pack === 'custom') { // 扩展包缺失时回退原版
        var s2 = document.createElement('script');
        s2.src = 'game.js';
        s2.onload = function () { if (typeof window.main === 'function') window.main(); };
        document.head.appendChild(s2);
      }
    };
    document.head.appendChild(packScript);
  </script>
  <script src="virtualpad.js"></script>
</body>
</html>
